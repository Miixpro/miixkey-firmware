name: Notify Discord about releases

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_name:
        description: "Release title"
        required: true
        default: "MiixKey Firmware v1.4.9"
        type: string

      release_tag:
        description: "Release tag"
        required: true
        default: "v1.4.9"
        type: string

      release_url:
        description: "Release URL"
        required: true
        default: "https://github.com/Miixpro/miixkey-firmware/releases/tag/v1.4.9"
        type: string

      release_body:
        description: "Release notes"
        required: true
        default: "This is a manual Discord notification for the MiixKey Firmware v1.4.9 release."
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send release notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name || inputs.release_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_URL: ${{ github.event.release.html_url || inputs.release_url }}
          RELEASE_BODY: ${{ github.event.release.body || inputs.release_body }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "Missing DISCORD_WEBHOOK_URL repository secret."
            exit 1
          fi

          title="${RELEASE_NAME:-${RELEASE_TAG}}"
          description="${RELEASE_BODY:-No release notes provided.}"

          if (( ${#description} > 3900 )); then
            description="${description:0:3900}"$'\n\n…'
          fi

          payload="$(jq -n \
            --arg title "$title" \
            --arg url "$RELEASE_URL" \
            --arg description "$description" \
            --arg repository "$REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            '{
              username: "GitHub Releases",
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 5763719,
                footer: { text: ($repository + " • " + $tag) }
              }]
            }')"

          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$payload"
